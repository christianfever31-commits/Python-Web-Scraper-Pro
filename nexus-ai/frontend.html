<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI – Mobile App Factory</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: white;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 24px;
        }
        textarea {
            width: 100%;
            padding: 16px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            margin-bottom: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .logs {
            background: #111;
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry { padding: 4px 0; border-bottom: 1px solid #222; }
        .result {
            background: #111;
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #888; }
        code { background: #222; padding: 2px 6px; border-radius: 6px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🚀 Nexus AI on Termux</h1>
    <textarea id="prompt" rows="4" placeholder="Describe your app...&#10;&#10;Example: 'Build me a todo list app'"></textarea>
    <button id="generateBtn" onclick="generateApp()">✨ Generate App</button>

    <h3 style="margin-top: 24px;">📋 Logs</h3>
    <div id="logs" class="logs">
        <div class="log-entry info">Ready. Enter a prompt and click Generate.</div>
    </div>

    <div id="result"></div>
</div>

<script>
    function addLog(message, type = 'info') {
        const logsDiv = document.getElementById('logs');
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
        logsDiv.appendChild(entry);
        logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    async function generateApp() {
        const prompt = document.getElementById('prompt').value.trim();
        if (!prompt) {
            addLog('⚠️ Please enter a prompt first', 'error');
            return;
        }

        const btn = document.getElementById('generateBtn');
        btn.disabled = true;
        btn.textContent = '⚙️ Generating...';
        addLog(`🚀 Starting generation: "${prompt.substring(0, 50)}..."`, 'info');

        try {
            const response = await fetch('http://localhost:8000/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt, platform: 'auto' })
            });
            const data = await response.json();

            if (data.success) {
                addLog(`✅ App generated: ${data.requirements.name}`, 'success');
                addLog(`📁 File: ${data.deployment_urls.preview}`, 'info');
                document.getElementById('result').innerHTML = `
                    <div class="result">
                        <p><strong>App Name:</strong> ${data.requirements.name}</p>
                        <p><strong>Features:</strong> ${data.requirements.features.join(', ')}</p>
                        <p><strong>Saved to:</strong> <code>${data.deployment_urls.preview}</code></p>
                        <p class="success">📂 To view: copy the file from <code>~/tmp/</code> to <code>/sdcard/</code></p>
                    </div>
                `;
            } else {
                addLog(`❌ Error: ${data.error}`, 'error');
            }
        } catch (err) {
            addLog(`❌ Connection error: ${err.message} (is the backend running on port 8000?)`, 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = '✨ Generate App';
        }
    }
</script>
</body>
</html>
